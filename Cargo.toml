[package]
name = "ticktick-cli"
version = "1.0.0-rc.3"
edition = "2024"
description = "A CLI for TickTick task management"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
strsim = "0.11"
rmcp = { version = "3.10", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal", "net"] }
schemars = "1"
axum = "0.8"
jiff = "1.0.0"

[dev-dependencies]
assert_cmd = "2"
httpmock = "0.9"
predicates = "3"
tempfile = "3"
