[package]
name = "ticktick-cli"
version = "0.3.0"
edition = "2024"
description = "A CLI for TickTick task management"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
libc = "0.2"
